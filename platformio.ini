[env:m5stack-core-esp32]
platform = espressif32@6.9.0
board = m5stack-core-esp32
framework = arduino
lib_deps =
    m5stack/M5Stack@^0.4.6
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:m5stack-fire]
platform = espressif32@6.9.0
board = m5stack-fire
framework = arduino
lib_deps =
    m5stack/M5Stack@^0.4.6
    adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DM5FIRE
